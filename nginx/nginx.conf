user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" X-Env-ID=$http_x_env_id';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Default server — shows platform info
    server {
        listen 80 default_server;
        server_name _;

        location / {
            return 200 '{"service":"devops-sandbox","status":"ready","message":"Add Host header matching your env ID"}';
            add_header Content-Type application/json;
        }

        location /nginx-health {
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }
    }

    # Auto-generated per-environment configs
    include /etc/nginx/conf.d/*.conf;
}
