# monitor/netdata/netdata.conf
# Netdata configuration for devops-sandbox
# Full reference: https://learn.netdata.cloud/docs/netdata-agent/configuration

[global]
  # How often to collect metrics (seconds)
  update every = 2

  # How long to keep metrics in memory (seconds)
  # 1 hour of high-res data
  history = 3600

  # Bind only to localhost — Nginx proxies if you need external access
  bind to = 0.0.0.0

[plugins]
  # Enable Docker container monitoring
  cgroups = yes
  proc = yes
  diskspace = yes
  network viewer = yes

[plugin:cgroups]
  # Label sandbox containers so they group nicely in the dashboard
  enable cpuacct = yes
  enable memory = yes
  enable blkio = yes
  enable systemd services = no

[health]
  # Enable built-in alerts (memory pressure, high CPU, etc.)
  enabled = yes

[logs]
  # Suppress verbose startup logging
  error log = /var/log/netdata/error.log
  access log = none
  debug log = none
  severity level = warning
